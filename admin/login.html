<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - PURR-OGRAM Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a0b2e;
           color: #1e1b4b; font: 15px/1.45 "Consolas", "Courier New", monospace; }
    form { width: min(360px, calc(100vw - 32px)); background: #fff7fb; border: 4px solid #f472b6; box-shadow: 6px 6px 0 #3b0d3a; padding: 22px; }
    .logo { display: block; width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 12px; image-rendering: pixelated; }
    h1 { margin: 0; text-align: center; color: #db2777; font-size: 20px; letter-spacing: 2px; }
    p { margin: 4px 0 14px; text-align: center; color: #6b7280; font-size: 13px; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: bold; }
    input { font: inherit; width: 100%; padding: 8px 10px; border: 3px solid #1e1b4b; background: #fff; }
    input:focus { outline: none; border-color: #db2777; }
    button { width: 100%; margin-top: 18px; font: inherit; font-weight: bold; letter-spacing: 1px; padding: 10px; border: 3px solid #1e1b4b;
             background: #34d399; color: #1e1b4b; cursor: pointer; box-shadow: 3px 3px 0 #1e1b4b; }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1e1b4b; }
    button:disabled { opacity: 0.5; }
    .msg { min-height: 1.4em; margin-top: 12px; text-align: center; font-weight: bold; color: #b91c1c; }
    a { display: block; margin-top: 10px; text-align: center; color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <form id="login" autocomplete="off">
    <img class="logo" src="/icons/icon-192.png" alt="">
    <h1>TEKIS BOOTH ADMIN</h1>
    <p>Staff only &middot; Tech Innovators Society</p>
    <label for="user">USERNAME</label>
    <input id="user" name="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="pass">PASSWORD</label>
    <input id="pass" name="password" type="password" required>
    <button id="go" type="submit">SIGN IN</button>
    <div id="msg" class="msg" role="alert"></div>
    <a href="/">&larr; back to the game</a>
  </form>
  <script>
    const form = document.getElementById('login'), msg = document.getElementById('msg'), go = document.getElementById('go');
    document.getElementById('user').focus();
    form.addEventListener('submit', async e => {
      e.preventDefault();
      go.disabled = true;
      msg.textContent = '';
      try {
        const res = await fetch('/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) return location.replace('/admin');
        msg.textContent = data.error || 'Sign in failed.';
        form.password.value = '';
        form.password.focus();
      } catch (err) {
        msg.textContent = 'Cannot reach the server. Is it running?';
      }
      go.disabled = false;
    });
    window.addEventListener('keydown', e => { if (e.key === 'Escape') location.replace('/'); });
  </script>
</body>
</html>
